# Guest gọi kèm anon/publishable key -> gateway tự verify.
[functions.create-order]
verify_jwt = true

[functions.apply-discount]
verify_jwt = true

[functions.cancel-payment]
verify_jwt = true

# PayOS KHÔNG gửi JWT. Bảo mật dựa hoàn toàn vào HMAC checksum trong body.
[functions.payos-webhook]
verify_jwt = false

# Phải là JWT đã đăng nhập (không phải anon key) — hàm tự kiểm tra thêm
# is_admin() của chính JWT đó qua callerIsAdmin(), verify_jwt ở đây chỉ đảm
# bảo chữ ký hợp lệ trước khi vào tới code.
[functions.create-staff-account]
verify_jwt = true

# pg_cron gọi qua pg_net, không có JWT. Hàm tự kiểm tra header x-cron-secret
# với secret "cron_secret" trong Vault (verify_cron_secret()).
[functions.purge-attendance-media]
verify_jwt = false
